spring:
  application:
    name: ${SPRING_APPLICATION_NAME:football-team}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    cors:
      allowed-origins:
        - "http://localhost:4200"
        - "http://127.0.0.1:4200"
        - "http://localhost:56168"
        - "http://127.0.0.1:56168"
        - "http://127.0.0.1:58894"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      path-pattern: /api/**

# yaml
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080

# Paramètres d'application communs (ne contient pas de secrets)
app:
  jwt:
    # expiration en ms (1h)
    expiration-ms: 3600000

# Actuator / Micrometer (Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: info,health,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
