spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Allow tests to run even if migration files changed locally (skip checksum validation)
    validate-on-migrate: false

# Use random port for tests
server:
  port: 0

app:
  jwt:
    expiration-ms: 3600000

